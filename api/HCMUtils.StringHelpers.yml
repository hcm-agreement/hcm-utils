  assemblies:
  - HCMUtils
  namespace: HCMUtils
  summary: >-
    Parses a number with a SI prefix appended, e.g. 145.5M is 145500000.

    Its confusingly called a prefix though it follows the number as usually a unit is prefixed with it.

    Only Mega, Giga and kilo are supported.
  example: []
  syntax:
    content: public static double ParseSINumber(string input)
    parameters:
    - id: input
      type: System.String
      description: A string representing the number to parse
    return:
